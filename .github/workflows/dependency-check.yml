name: OWASP Dependency Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/build.gradle.kts'
      - 'backend/settings.gradle.kts'
      - 'backend/gradle/**'
      - 'backend/gradlew'
      - 'backend/gradlew.bat'
      - 'backend/dependency-check-suppression.xml'

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Dependency-Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew dependencyCheckAnalyze --no-daemon --stacktrace

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: |
            backend/build/reports/dependency-check-report.html
            backend/build/reports/dependency-check-report.json
            backend/build/reports/dependency-check-report.sarif
