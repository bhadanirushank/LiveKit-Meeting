openapi: 3.1.0
info:
  title: LiveKit Meeting API
  version: 1.0.0
  description: Backend API for the LiveKit Meeting Application. Implements secure ephemeral meetings, waiting room management, live polling, and token issuance.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://api.livekitmeeting.local/api/v1
    description: Production server
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MeetingCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Weekly Sync
        maximumParticipants:
          type:
            - integer
            - 'null'
          example: 50
        waitingRoomEnabled:
          type: boolean
          example: true
        joinBeforeHostEnabled:
          type: boolean
          example: false
        passcode:
          type:
            - string
            - 'null'
          example: '123456'
    MeetingCreateResponse:
      type: object
      properties:
        publicMeetingCode:
          type: string
          example: a1b2c3d4
        hostSecret:
          type: string
          example: xyz123abc456
    HostExchangeRequest:
      type: object
      required:
        - publicMeetingCode
        - hostSecret
      properties:
        publicMeetingCode:
          type: string
        hostSecret:
          type: string
    TokenResponse:
      type: object
      properties:
        token:
          type: string
    JoinRequestInput:
      type: object
      required:
        - displayName
        - deviceSessionId
      properties:
        displayName:
          type: string
        deviceSessionId:
          type: string
          format: uuid
        passcode:
          type:
            - string
            - 'null'
    JoinRequestResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
    PollCreateRequest:
      type: object
      required:
        - question
        - options
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
        allowMultipleSelection:
          type: boolean
        isAnonymous:
          type: boolean
    PollVoteRequest:
      type: object
      required:
        - optionIndices
      properties:
        optionIndices:
          type: array
          items:
            type: integer
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: MEETING_NOT_FOUND
        message:
          type: string
          example: The requested meeting does not exist.
    SessionBootstrapRequest:
      type: object
      required:
        - installationId
        - platform
      properties:
        installationId:
          type: string
          format: uuid
        platform:
          type: string
        appVersion:
          type:
            - string
            - 'null'
        deviceModel:
          type:
            - string
            - 'null'
        osVersion:
          type:
            - string
            - 'null'
    SessionBootstrapResponse:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
    SessionRefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
    EncryptedTokenResponse:
      type: object
      properties:
        encryptedToken:
          type: string
        iv:
          type: string
    JoinRequestStatusResponse:
      type: object
      properties:
        status:
          type: string
    MeetingStatusResponse:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
paths:
  /meetings:
    post:
      operationId: createMeeting
      summary: Create a new meeting
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingCreateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /host-sessions/exchange:
    post:
      operationId: exchangeHostSecret
      summary: Exchange host secret for JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostExchangeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
